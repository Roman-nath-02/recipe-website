<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff9f5">
    <meta name="description" content="A little home for the recipes you love.">
    <title>Sunday Spoon — recipes for real life</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="#" aria-label="Sunday Spoon home">
        <span class="wordmark-mark" aria-hidden="true">s</span>
        <span>Sunday Spoon</span>
      </a>
      <p class="header-note">Good things, kept close.</p>
    </header>

    <main class="page-shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow"><span class="pixel-dot" aria-hidden="true"></span> A recipe box for every day</p>
        <h1 id="page-title">Made to be <em>shared.</em></h1>
        <p class="intro-copy">A growing collection of the good things from your kitchen.</p>
      </section>

      <section class="browse" aria-label="Browse recipes">
        <div class="filters">
          <label class="search-field">
            <span class="visually-hidden">Search recipes</span>
            <svg aria-hidden="true" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5"></circle><path d="m13 13 4 4"></path></svg>
            <input id="recipe-search" type="search" placeholder="Find something lovely..." autocomplete="off">
          </label>
          <label class="category-field">
            <span class="visually-hidden">Filter by category</span>
            <select id="category-filter">
              <option value="">All categories</option>
            </select>
          </label>
        </div>
        <div id="recipe-content" aria-live="polite" aria-busy="true">
          <p class="loading-message">Gathering the recipe cards...</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span class="footer-spark" aria-hidden="true">✳</span>
      <p>Made with care, and a little bit of butter.</p>
    </footer>
  </body>
</html>
